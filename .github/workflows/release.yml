name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            runner: ubuntu-24.04
          - goarch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libc6-dev libpcap-dev
      - name: Test
        run: go test ./...
      - name: Build release package
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
          OUT_DIR: dist
        run: ./scripts/build-release.sh "${GITHUB_REF_NAME:-dev}"
      - uses: actions/upload-artifact@v4
        with:
          name: knockgate-linux-${{ matrix.goarch }}
          path: |
            dist/knockgate_linux_${{ matrix.goarch }}.tar.gz
            dist/knockgate_linux_${{ matrix.goarch }}.tar.gz.sha256

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Prepare shell client assets
        run: chmod 0755 clients/shell/knockgate-knock.sh
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/knockgate_linux_amd64.tar.gz
            dist/knockgate_linux_amd64.tar.gz.sha256
            dist/knockgate_linux_arm64.tar.gz
            dist/knockgate_linux_arm64.tar.gz.sha256
            clients/shell/knockgate-knock.sh
